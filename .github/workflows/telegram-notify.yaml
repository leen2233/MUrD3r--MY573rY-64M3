name: Telegram Notification

on:
  issues:
    types: [opened, edited, assigned, labeled, closed]
  issue_comment:
    types: [created]
  projects_v2_item:
    types: [added, edited] # For Kanban project board updates

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          parse_mode: "Markdown"
          message: |
            *Repo:* `[[repository]]`
            *Event:* `${{ github.event_name }}`
            *Action:* `${{ github.event.action }}`
            *User:* `${{ github.actor }}`

            **Details:**
            ${{ github.event.issue.title || github.event.comment.body || 'Kanban / Project Update' }}

            🔗 [View on GitHub](${{ github.event.issue.html_url || github.event.repository.html_url }})
